services:
  - type: web
    name: ultra-systems-frontend
    env: node
    rootDir: apps/web
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXTAUTH_URL
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
  - type: web
    name: ultra-systems-backend
    env: node
    rootDir: apps/backend
    buildCommand: "npm install"
    startCommand: "npm run start:prod"
    envVars:
      - key: MONGODB_URI
        fromService:
          type: mongodb
          name: ultra-systems-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ultra-systems-frontend
          property: url
databases:
  - name: ultra-systems-db
    databaseName: ultra_systems
    ipAllowList: []
