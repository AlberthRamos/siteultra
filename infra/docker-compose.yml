version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ultra-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ultra_systems
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ultra-network

  # Backend API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ultra-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/ultra_systems
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - ultra-network
    volumes:
      - ./api:/app
      - /app/node_modules

  # Frontend (Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultra-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - api
    networks:
      - ultra-network
    volumes:
      - .:/app
      - /app/node_modules

  # Mongo Express (Database UI - Optional)
  mongo-express:
    image: mongo-express:latest
    container_name: ultra-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ultra2024
    depends_on:
      - mongodb
    networks:
      - ultra-network

networks:
  ultra-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
